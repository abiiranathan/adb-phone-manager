[package]
name = "adb-phone-manager"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "egui front end for browsing and controlling an Android phone over adb"

[dependencies]
eframe = "0.31"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui_extras = { version = "0.31", default-features = false }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true